name: Import static website
on:
  push:
    paths: ["othmne.cc.zip", ".github/workflows/import.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand website into repository
        shell: bash
        run: |
          if [ ! -f othmne.cc.zip ]; then exit 0; fi
          mkdir -p /tmp/website
          unzip -oq othmne.cc.zip -d /tmp/website
          cp -R /tmp/website/. .
          git rm othmne.cc.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import static website source and Demoty pages"
          git push
